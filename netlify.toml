[build]
  publish = "build/web"
  command = """
    if [ ! -d "flutter" ]; then
      git clone https://github.com/flutter/flutter.git -b stable --depth 1
    fi
    export PATH="$PATH:`pwd`/flutter/bin"
    flutter doctor -v
    flutter pub get
    flutter build web --release --base-href /
  """

[functions]
  directory = "netlify/functions"

# API Redirects to Netlify Serverless Functions
[[redirects]]
  from = "/api/payment/create-order"
  to = "/.netlify/functions/create-order"
  status = 200

[[redirects]]
  from = "/api/payment/verify-payment"
  to = "/.netlify/functions/verify-payment"
  status = 200

[[redirects]]
  from = "/api/payment/config"
  to = "/.netlify/functions/config"
  status = 200

# SPA fallback redirect for Flutter Web
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
